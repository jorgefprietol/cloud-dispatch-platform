server:
  port: 8080
spring:
  application:
    name: dispatch-worker
logging:
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
dispatch:
  queue-url: ${QUEUE_URL}
  bucket: ${REPORT_BUCKET}
  api-url: ${ORDERS_API_URL}
  worker-secret: ${WORKER_SECRET}
  endpoint: ${AWS_ENDPOINT:}
  region: ${AWS_REGION:us-east-1}
  topic-arn: ${NOTIFICATION_TOPIC_ARN:}
