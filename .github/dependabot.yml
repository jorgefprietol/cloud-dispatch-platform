version: 2
updates:
  - package-ecosystem: nuget
    directory: /services/orders-api
    schedule: {interval: weekly}
  - package-ecosystem: maven
    directory: /services/dispatch-worker
    schedule: {interval: weekly}
  - package-ecosystem: nuget
    directory: /services/audit-function
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /apps/console
    schedule: {interval: weekly}
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      console-toolchain:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /infra
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      workflow-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/services/orders-api,/services/dispatch-worker,/services/audit-function,/apps/console]
    schedule: {interval: weekly}
    # LTS runtime migrations are reviewed together with CI, build and application code.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: maven
        update-types: [version-update:semver-major, version-update:semver-minor]
