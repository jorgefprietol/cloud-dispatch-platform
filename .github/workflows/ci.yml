name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dotnet:
    name: C# validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/Orders.Tests/Orders.Tests.csproj --locked-mode
      - run: dotnet test tests/Orders.Tests/Orders.Tests.csproj -c Release --no-restore --logger trx
  java:
    name: Java validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f services/dispatch-worker/pom.xml verify
  web-infra:
    name: Web and AWS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/console/package-lock.json
            infra/package-lock.json
      - run: npm ci && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: apps/console
      - run: npm ci && npm run build && npm test && npm run audit && npm run synth
        working-directory: infra
      - name: Synthesize complete AWS topology offline
        working-directory: infra
        run: |
          npx cdk synth --quiet -c offline=true -c runtime=true \
            -c domain=dispatch.example.com -c zoneName=example.com -c zoneId=Z000TEST \
            -c certificateArn=arn:aws:acm:us-east-1:111111111111:certificate/00000000-0000-0000-0000-000000000000 \
            -c imageTag=test
  integration:
    name: Container integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: node scripts/smoke.mjs
      - run: node scripts/chaos.mjs
      - run: node scripts/seed.mjs && node scripts/seed.mjs
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/console
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-diagnostics
          path: |
            compose.log
            apps/console/playwright-report
            apps/console/test-results
      - if: always()
        run: docker compose down -v
  images:
    name: Publish ${{ matrix.service }}
    needs: [dotnet,java,web-infra,integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: services/orders-api/Dockerfile
          - service: worker
            dockerfile: services/dispatch-worker/Dockerfile
          - service: web
            dockerfile: apps/console/Dockerfile
          - service: audit
            dockerfile: services/audit-function/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.service }}:sha-${{ github.sha }}
          platforms: linux/amd64
          sbom: ${{ matrix.service != 'audit' }}
          provenance: ${{ matrix.service != 'audit' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
