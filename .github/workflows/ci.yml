name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dotnet:
    name: C# validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/Orders.Tests/Orders.Tests.csproj --locked-mode
      - run: dotnet test tests/Orders.Tests/Orders.Tests.csproj -c Release --no-restore --logger trx
  java:
    name: Java validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -f services/dispatch-worker/pom.xml verify
  web-infra:
    name: Web and AWS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/console/package-lock.json
            infra/package-lock.json
      - run: npm ci && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: apps/console
      - run: npm ci && npm run build && npm test && npm run audit && npm run synth
        working-directory: infra
      - name: Synthesize complete AWS topology offline
        working-directory: infra
        run: |
          npx cdk synth --quiet -c offline=true -c runtime=true \
            -c domain=dispatch.example.com -c zoneName=example.com -c zoneId=Z000TEST \
            -c certificateArn=arn:aws:acm:us-east-1:111111111111:certificate/00000000-0000-0000-0000-000000000000 \
            -c imageTag=test
  integration:
    name: Container integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - run: node scripts/smoke.mjs
      - run: node scripts/chaos.mjs
      - run: node scripts/seed.mjs && node scripts/seed.mjs
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/console
      - name: Scan the tested worker and console images
        run: |
          mkdir -p artifacts/security
          scanner='aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969'
          for component in worker web; do
            image=$(docker compose images -q "$component")
            test -n "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy -v "$PWD/artifacts/security:/reports" "$scanner" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output "/reports/$component-vulnerabilities.json" "$image"
          done
      - name: Upload image security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-security-evidence
          path: artifacts/security/
          retention-days: 14
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-diagnostics
          path: |
            compose.log
            apps/console/playwright-report
            apps/console/test-results
      - if: always()
        run: docker compose down -v
  images:
    name: Publish ${{ matrix.service }}
    needs: [dotnet,java,web-infra,integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: services/orders-api/Dockerfile
          - service: worker
            dockerfile: services/dispatch-worker/Dockerfile
          - service: web
            dockerfile: apps/console/Dockerfile
          - service: audit
            dockerfile: services/audit-function/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.service }}:sha-${{ github.sha }}
          platforms: linux/amd64
          sbom: ${{ matrix.service != 'audit' }}
          provenance: ${{ matrix.service != 'audit' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
